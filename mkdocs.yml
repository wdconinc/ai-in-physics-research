site_name: AI in Physics Research
site_description: >-
  A 14-week graduate seminar on Generative AI and Knowledge Platforms
  for physics researchers — course materials, meeting plans, and homework assignments.
site_author: Department of Physics
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Syllabus: syllabus.md
  - Full Course Plan: full-course-plan.md
  - Instructor Resources:
    - Pedagogy Guide: pedagogy-style-guide.md
    - Course Design (Agent Fleet): course-design.md
    - QA Report: consistency-report.md
