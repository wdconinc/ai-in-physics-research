week: 2
phase: "Phase 1: The Common Baseline"
title: "Vibe-Coding & Pitfalls"

meetings:
  - meeting: 1
    title: "How AI Coding Assistants Generate Code — and Why They Fail"
    student_introduction:
      assigned_to: "one student (rotating schedule)"
      topic_prompt: |
        Research and demonstrate how large language model-based coding assistants —
        specifically GitHub Copilot and Claude (claude-3-5-sonnet) — generate code
        from natural language prompts. Focus on the internal mechanics that lead to
        failure: why does an LLM confidently hallucinate a non-existent NumPy or
        SciPy function, and what statistical properties of training data cause
        plausible-but-wrong physics outputs? Use the blog post "Copilot Internals"
        (GitHub Next, 2023) and Poldrack et al. "AI-assisted coding: Experiments with
        GPT-4" (arXiv:2304.13187) as primary sources. Your presentation must make the
        connection between how these tools are trained and the specific failure modes
        students will encounter in today's debugging exercise.
      format: "10-minute live demo"
      guiding_questions:
        - "What prompt structures (specification-first vs. open-ended) most reliably
          produce syntactically correct but physically wrong code, and why?"
        - "When an AI assistant hallucinates a scipy.integrate function signature,
          what about its training distribution explains that specific error?"
        - "How would you distinguish a hallucinated API call from a genuine API change
          between library versions if you could not run the code?"

    active_engagement:
      format: "Pair debugging"
      description: |
        Before class: the instructor prepares a Python script named
        week02_buggy_harmonic_oscillator.py (committed to the course repository)
        that was ostensibly generated by Claude to compute the first five energy
        levels of a quantum harmonic oscillator and plot the corresponding
        wavefunctions. The script contains exactly five planted bugs spanning three
        difficulty tiers:

          Bug 1 (easy — syntax/logic): The loop computing energy levels uses
          `E_n = hbar * omega * n` instead of `E_n = hbar * omega * (n + 0.5)`,
          omitting the zero-point energy term.

          Bug 2 (easy — off-by-one): The wavefunction array is indexed as
          `psi[1:N]` instead of `psi[0:N]`, causing the ground state wavefunction
          to be silently dropped from the plot.

          Bug 3 (medium — hallucinated API): The script calls
          `scipy.special.hermite_poly(n, x)`, which does not exist; the correct
          call is `scipy.special.hermite(n)(x)` (using the polynomial object
          returned by `scipy.special.hermite`).

          Bug 4 (medium — wrong normalization): The Hermite–Gaussian wavefunction
          is normalized by dividing by `np.sqrt(n!)` instead of
          `np.sqrt(2**n * math.factorial(n) * np.sqrt(np.pi))`, producing
          amplitudes that are not unit-normalized.

          Bug 5 (hard — plausible-but-wrong physics): The script plots probability
          density as `psi` instead of `np.abs(psi)**2`, so the y-axis shows the
          (signed) wavefunction rather than the probability density, which looks
          visually plausible but is physically incorrect.

        Step 1 (2 min): Instructor assigns pairs alphabetically by last name
        (five pairs for ten students). Each pair clones the repository and opens
        week02_buggy_harmonic_oscillator.py.

        Step 2 (3 min): Pairs run the script as-is and record every error message
        or unexpected output in a shared comment block at the top of the file.

        Step 3 (25 min): Pairs work to identify and fix all five bugs. For each
        bug found, they add a comment in this format:
          # BUG [number]: [one sentence describing what the AI got wrong]
          # FIX: [one sentence describing the correct approach]
        Pairs must not use AI tools during this phase — the goal is to apply their
        own physical reasoning and Python knowledge.

        Step 4 (5 min): Pairs verify their fixed script against two sanity checks:
        (a) the ground state energy printed to stdout must equal 0.5 * hbar * omega
        (with hbar=omega=1), and (b) the probability densities integrated over x
        must each equal 1.0 to within 1%.

        Step 5 (10 min): Class debrief — each pair shares the bug they found last
        (typically Bug 5). Instructor asks: "Which of these bugs would pytest catch
        automatically, and which require physical reasoning?"
      facilitation_notes: |
        Prepare the buggy script in advance and test that it runs without crashing
        on Bugs 1–4 (only Bug 3 raises an AttributeError; the others produce wrong
        results silently). This is intentional — students must check physical
        plausibility, not just error messages.

        If a pair finds all five bugs in fewer than 20 minutes, extend: ask them to
        write a pytest test suite with at least three assertions that would have
        caught bugs 1, 4, and 5 automatically.

        For pairs stuck on Bug 3: prompt them to run `help(scipy.special)` or check
        the SciPy docs page for `hermite` — do not tell them the correct call.

        For pairs stuck on Bug 5: ask "Does this quantity have to be non-negative
        everywhere? Why?" This usually surfaces the sign issue within two minutes.

        Keep a running tally on the whiteboard of which bugs each pair has found,
        so the room can see whether Bug 5 is consistently the last to be identified.
      estimated_duration: "45 minutes"
      materials_needed: >-
        week02_buggy_harmonic_oscillator.py committed to the course GitHub
        repository; Python environment with numpy, scipy, matplotlib, and math
        pre-installed; whiteboard for tracking pair progress; printed or projected
        SciPy documentation for scipy.special.hermite

  - meeting: 2
    title: "Test-Driven Prompting — Making AI Code Reliable"
    student_introduction:
      assigned_to: "one student (rotating schedule)"
      topic_prompt: |
        Research and present the "specification-first" and "test-driven" prompting
        strategies for AI code generation, as described in Chen et al. "Evaluating
        Large Language Models Trained on Code" (arXiv:2107.03374, the HumanEval
        paper) and the iterative refinement workflow documented in Peng et al.
        "Is Your Code Generated by ChatGPT Really Correct?" (arXiv:2305.01210).
        Focus specifically on how writing a pytest test suite before prompting the AI
        changes the quality of generated code compared to open-ended prompting. Your
        presentation must end with a live demonstration: show the class one example
        where a zero-shot prompt produces wrong code and a test-driven prompt produces
        correct code for the same physics task (suggested: computing the period of a
        simple pendulum as a function of amplitude using numerical integration).
      format: "8-minute chalk talk"
      guiding_questions:
        - "Why does providing an AI assistant with a failing test case before asking
          it to write code improve reliability, compared to describing the desired
          behavior in prose?"
        - "What kinds of physics errors can pytest reliably catch, and what kinds
          require a human physicist to verify?"
        - "In an iterative refinement workflow, how do you decide when to stop
          prompting and accept the AI's output?"

    active_engagement:
      format: "Live coding exercise"
      description: |
        Before class: the instructor commits a skeleton Jupyter notebook named
        week02_test_driven_skeleton.ipynb to the course repository. The notebook
        contains:
          - A problem statement: implement a projectile motion simulator in Python
            that computes range, maximum height, and time of flight for a given
            launch angle and initial speed, accounting for air resistance using a
            linear drag model (F_drag = -b*v).
          - A pre-written pytest test suite (five tests) that the correct solution
            must pass:
              test_vacuum_range: verifies the no-drag case matches the analytic
                formula R = v0^2 * sin(2*theta) / g.
              test_vacuum_max_height: verifies H_max = v0^2 * sin^2(theta) / (2*g)
                for zero drag.
              test_drag_reduces_range: verifies that adding any positive drag
                coefficient reduces range compared to the vacuum case.
              test_time_of_flight_positive: verifies that time of flight is always
                a positive finite number.
              test_symmetry_broken_by_drag: verifies that with drag, the optimal
                launch angle is strictly less than 45 degrees (requires numerical
                search over angles).
          - Three empty cells labeled "Your AI Prompt", "AI-Generated Code", and
            "Test Results".

        Step 1 (3 min): Instructor explains the workflow: students will write a
        prompt for Claude or GitHub Copilot that includes the test suite and asks
        the AI to generate code that passes all five tests. Students should NOT
        just paste the problem description — they must explicitly include the tests
        in their prompt.

        Step 2 (15 min): Each student individually prompts Claude (claude-3-5-sonnet
        via the web interface) or GitHub Copilot (in their editor) using a
        test-driven prompt of their own design. They paste the AI output into the
        "AI-Generated Code" cell and run pytest.

        Step 3 (10 min): Students who have passing tests help those who do not by
        comparing prompt strategies — not by sharing code. Instructor circulates and
        asks each student: "What did you include in your prompt that you think made
        the difference?"

        Step 4 (10 min): Each student runs one iteration of refinement: take the
        failing test output, include it verbatim in a follow-up prompt, and ask
        the AI to fix its own code. Document whether the AI identifies the physical
        root cause or only addresses the Python error.

        Step 5 (7 min): Whole-class debrief. Instructor collects on the whiteboard:
        (a) how many students passed all 5 tests on the first attempt, (b) which
        test was hardest to get the AI to pass, and (c) one example where the AI
        "fixed" a failing test by weakening the assertion rather than fixing the
        physics. Discuss: what does that failure mode tell us about AI reliability?
      facilitation_notes: |
        Pre-run the skeleton notebook and confirm pytest is importable and that the
        five tests fail on an empty implementation (returning zeros) — this is the
        expected starting state.

        Expect most first-attempt AI outputs to pass tests 1–4 but fail
        test_symmetry_broken_by_drag, because this test requires the AI to implement
        a numerical optimization loop that it may not include unless explicitly
        prompted. Use this as a teaching moment about specification completeness.

        If students find that the AI passes all tests with a trivial solution (e.g.,
        hardcoding the expected output), point out that their test suite is
        underspecified and ask them to add a test with a different set of input
        parameters.

        Reserve 2 minutes at the end to explicitly connect today's activity to
        Mini-Assignment 2: students will apply this exact test-driven prompting
        workflow to a different physics script for their homework.

        Distribute Mini-Assignment 2 at the end of this meeting.
      estimated_duration: "45 minutes"
      materials_needed: >-
        week02_test_driven_skeleton.ipynb committed to the course GitHub repository;
        Python environment with numpy, scipy, and pytest pre-installed; student
        access to Claude (claude-3-5-sonnet) via web interface or GitHub Copilot
        via IDE; projector to display prompt comparison during debrief

homework:
  week: 2
  title: "Bug Hunt and Test-Driven Repair of an AI-Generated Physics Script"
  phase: "Phase 1: The Common Baseline"
  assessment_category: "Standard Curriculum Mini-Assignments"
  background: |
    AI coding assistants frequently generate code that is syntactically valid,
    runs without crashing, and produces output that looks physically reasonable —
    yet contains subtle errors that only careful physical reasoning can detect.
    This assignment trains you to be a critical consumer of AI-generated physics
    code by systematically finding, documenting, and repairing bugs in a script
    that was generated by Claude (claude-3-5-sonnet) with minimal prompting.
    You will then apply the test-driven prompting strategy practiced in class to
    produce a corrected, well-tested replacement.
  instructions:
    - step: 1
      text: >-
        Clone the course repository and open
        week02_starter/ai_generated_oscillator.py. This script was produced by
        Claude with the prompt "Write a Python script that computes and plots the
        first five energy levels and wavefunctions of the quantum harmonic
        oscillator using numpy and scipy." Run the script using Python 3.10+ and
        record every error message and every output value. Do not fix anything yet
        — just observe. Write your observations in a markdown file named
        week02_<lastname>_bugreport.md.
    - step: 2
      text: >-
        Identify all bugs in ai_generated_oscillator.py. There are exactly five.
        For each bug, add an entry to week02_<lastname>_bugreport.md with the
        following fields: (a) Bug number and location (file and line number);
        (b) Category — choose one of: hallucinated API, off-by-one error, wrong
        physics formula, incorrect normalization, or wrong output quantity;
        (c) What the AI produced and why it is wrong — explain in one to two
        sentences using physical reasoning, not just "it crashes"; (d) The correct
        code and a citation (equation number from Griffiths "Introduction to
        Quantum Mechanics" or equivalent) supporting your fix.
    - step: 3
      text: >-
        Write a pytest test suite in week02_<lastname>.ipynb (in a dedicated test
        cell that can be run with pytest --nbmake, or as a standalone
        week02_<lastname>_tests.py file) containing at least five tests that
        collectively would have caught all five bugs if they had existed before the
        AI generated the code. Each test must include a docstring explaining what
        physical property it checks and why. Run your tests against the original
        buggy script to confirm they fail, then run them against your fixed version
        to confirm they pass. Include the pytest output for both runs in your
        notebook.
    - step: 4
      text: >-
        Use a test-driven prompting strategy to ask Claude (claude-3-5-sonnet) or
        GitHub Copilot to regenerate the quantum harmonic oscillator script from
        scratch, this time including your test suite in the prompt. Paste your full
        prompt into a markdown cell in week02_<lastname>.ipynb, then paste the
        AI's output into the next code cell and run your test suite against it.
        If any tests still fail, perform one round of iterative refinement: paste
        the failing test output back into Claude and ask it to correct its code.
        Document whether the AI's correction addresses the physical root cause or
        only the Python error. Include a one-paragraph reflection on what this
        exercise reveals about the reliability of AI-assisted physics coding.
  deliverables:
    - >-
      A Jupyter notebook named week02_<lastname>.ipynb containing: your five-test
      pytest suite with docstrings; the pytest output for the buggy script (showing
      failures) and for the fixed script (showing all passing); your test-driven
      AI prompt and the AI-generated corrected code; and the one-paragraph
      reflection on AI reliability.
    - >-
      A markdown file named week02_<lastname>_bugreport.md containing the structured
      bug report for all five bugs (number, location, category, explanation, correct
      code with citation).
    - >-
      A requirements.txt or environment.yml listing all Python package versions
      used (numpy, scipy, matplotlib, pytest, and any others), with a README.md
      containing one paragraph of instructions for reproducing your results from a
      fresh clone.
  grading_criteria:
    - criterion: "Methodology correctness"
      weight: "30%"
      description: >-
        All five bugs are correctly identified with accurate category labels and
        physically grounded explanations; the test-driven prompting strategy is
        applied as specified (tests written before prompting, failing test output
        used in refinement); the corrected script produces physically correct
        energy levels (E_n = hbar*omega*(n+0.5) with hbar=omega=1 giving
        0.5, 1.5, 2.5, 3.5, 4.5) and unit-normalized probability densities.
    - criterion: "Reproducibility"
      weight: "25%"
      description: >-
        Any graduate student can re-run the notebook and all tests from a fresh
        clone using only the provided requirements.txt and the README instructions;
        random seeds are set where applicable; no hardcoded absolute paths; API
        keys (if any) are loaded from environment variables.
    - criterion: "Physical plausibility"
      weight: "25%"
      description: >-
        The bug report explains each error in terms of physical consequences (not
        just Python behavior); at least two tests check explicitly physical
        properties (e.g., non-negativity of probability density, correct zero-point
        energy, unit normalization); the reflection paragraph connects AI failure
        modes to physical reasoning requirements.
    - criterion: "Code clarity"
      weight: "20%"
      description: >-
        The notebook reads as a coherent document; each pytest test has a docstring
        stating the physical property being checked; the bug report is clearly
        structured with all required fields; the AI prompt is reproduced verbatim
        and annotated with a sentence explaining the prompting strategy used.
  estimated_time: "3-5 hours"
  due: "Before the first class meeting of Week 3"
  tools_and_resources:
    - "Claude (claude-3-5-sonnet) via https://claude.ai — free tier is sufficient"
    - "GitHub Copilot — available via student GitHub Education Pack or course license"
    - "pytest — install via 'pip install pytest' or include in environment.yml"
    - "pytest-nbmake — optional, allows running pytest directly on Jupyter notebooks"
    - "NumPy (numpy >= 1.24), SciPy (scipy >= 1.10), Matplotlib (matplotlib >= 3.7)"
    - "Griffiths, D.J. 'Introduction to Quantum Mechanics' (3rd ed.) — Chapter 2
      (sections 2.3–2.4) for the harmonic oscillator energy levels and wavefunctions"
    - "Course repository: week02_starter/ directory contains ai_generated_oscillator.py"
    - "arXiv:2304.13187 (Poldrack et al.) for background on AI coding failure modes"
