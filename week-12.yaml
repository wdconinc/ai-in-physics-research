week: 12
phase: "Phase 3: Project Execution & Polish"
title: "Seminar / Reading Group Part 2"

learning_objectives:
  - "Provide and receive a second round of peer review focused on reproducibility gaps and documentation completeness."
  - "Resolve all blocking code review comments and document decisions in commit messages."
  - "Write a limitations section that honestly characterizes the AI methods and their failure modes."

milestones:
  - "Second round of peer code reviews completed."
  - "All blocking review comments resolved in the project repository."

meetings:
  - meeting: 1
    title: "Advanced & Cross-Cutting AI-in-Physics Reading Group"
    student_introduction:
      assigned_to: "two students (the remaining students who have not yet led a paper discussion)"
      topic_prompt: |
        Each of the two students leads a 15-minute paper discussion on a cross-cutting or advanced AI-in-physics paper — one that addresses AI reproducibility or reliability at a field-wide scale rather than within a single method. Recommended papers (choose one each, or propose an alternative with instructor approval):
          • Hutson, M. (2018). "Artificial intelligence faces reproducibility crisis." Science 359(6377):725-726. https://doi.org/10.1126/science.359.6377.725
          • Kapoor, S. & Narayanan, A. (2023). "Leakage and the Reproducibility Crisis in ML-based Science." Patterns 4(9):100804. https://doi.org/10.1016/j.patter.2023.100804
        Each presenter should: (1) sketch the paper's main claim and evidence on the whiteboard; (2) locate a concrete example of the failure mode the paper describes in AI-in-physics literature; (3) propose one corrective practice the class could adopt today.
        Use the format "15-minute paper discussion (whiteboard outline)": draw the argument structure, not slides. No notes — you must be able to reproduce the paper's core logic from memory at the whiteboard.
        Guiding questions your discussion must address:
          1. What specific evaluation or publication practice does this paper identify as the root cause of irreproducibility?
          2. Does this failure mode apply to your own project? Where?
          3. What would a reproducibility-passing version of the paper's worst-case example look like?
      format: "15-minute paper discussion (whiteboard outline)"
      guiding_questions:
        - "What specific evaluation or publication practice does this paper identify as the root cause of irreproducibility?"
        - "Does this failure mode apply to your own project? Where?"
        - "What would a reproducibility-passing version of the paper's worst-case example look like?"
    active_engagement:
      format: "Socratic seminar"
      description: |
        Synthesis discussion connecting all four papers discussed across Weeks 11 and 12. The goal is to surface shared evaluation patterns and open problems that cut across AI methods in physics.

        Central question posed by the instructor at the start of the seminar:
        "After four papers, what is the single most important thing the physics community should change about how it evaluates AI-generated results — and what would stop it from doing so?"

        Structure (45 min):
        - Round 1, "First responses" (12 min): Instructor cold-calls each student in turn for a 60-90 second response to the central question. No interruptions; other students take brief notes.
        - Round 2, "Peer responses" (15 min): Each student may respond to a specific thing someone said in Round 1. Instructor enforces the rule that a student may not simply repeat their Round 1 point — they must engage with another student's idea.
        - Round 3, "Convergence or divergence?" (10 min): Instructor asks: "Which two student positions from Round 1 are most in tension? Can they be reconciled?" Instructor facilitates direct dialogue between the two named students.
        - Debrief (8 min): Instructor lists on the whiteboard the 2-3 key disagreements that were NOT resolved. These become optional essay prompts available for the final paper's discussion section.

        Instructor follow-up probes (use if discussion stalls):
          • "Kapoor & Narayanan argue that leakage is the rule, not the exception. Does anyone disagree? What would falsify that claim for physics specifically?"
          • "Hutson wrote in 2018. Name one thing that has concretely improved since then, and one thing that has gotten worse."
          • "If you were a referee, which of today's papers would you reject for reproducibility reasons? Be specific."

        No laptops during seminar. Students should bring the Week 11 and Week 12 papers with annotations.
      facilitation_notes: |
        Before Round 1, write each paper's title on the whiteboard so students can reference them by number. Cold-call by name — do not open to volunteers; equitable participation is especially important in a 10-person seminar where confident students can dominate. Keep a live whiteboard list of the key claims being made; update it between rounds. At the start of Round 2, point to two claims on the board that are in apparent tension and ask students to address the tension directly. If a student raises a genuinely novel point not captured on the board, add it; this signals that new ideas are welcome even late in the discussion. Reserve the final 2 minutes of the debrief to ask: "What single sentence would you add to your own limitations section because of today's discussion?"
      estimated_duration: "45 minutes"
      materials_needed: "Whiteboard and markers; printed or annotated digital copies of all four reading-group papers (Weeks 11 and 12); no laptops during seminar"

  - meeting: 2
    title: "In-Class Peer Code Review — Reproducibility Audit"
    student_introduction:
      assigned_to: "one student (rotating schedule)"
      topic_prompt: |
        Topic: what a complete, publication-ready README looks like for an AI-assisted physics project. Study the following resources before class:
          • "Art of README" (github.com/hackergrrl/art-of-readme) — read the full document.
          • At least two READMEs from published AI-in-physics codebases on GitHub (e.g., from papers with code, paperswithcode.com, filtered to physics).
          • The Software Sustainability Institute checklist for research software documentation (software.ac.uk/resources/guides/how-write-readme).
        Your 8-minute chalk talk (no notes, whiteboard only) must cover exactly these five required elements of a publication-ready README:
          1. Installation: exact commands from a clean environment (conda or venv, Python version pinned).
          2. Data download: the exact command or URL to retrieve all input data, plus the expected file sizes or checksums.
          3. Reproduction command: the single command that regenerates all figures in the paper (e.g., `make reproduce`).
          4. Expected outputs: what the user should see — with numerical ranges or sha256 checksums for key output files.
          5. Known failure modes: at least one documented situation in which the pipeline fails or gives wrong results, with a workaround.
        End your talk by posing this question to the room: "Of the five elements, which one is most commonly missing in physics code releases — and why?"
      format: "8-minute chalk talk"
      guiding_questions:
        - "Of the five README elements, which is most commonly missing in physics code releases — and why?"
        - "How do you write a reproduction command that works on hardware you don't control?"
        - "What is the difference between documenting a known failure mode and hiding it?"
    active_engagement:
      format: "Peer code review"
      description: |
        Second in-class peer code review session, focused entirely on reproducibility audit. This round uses a different partner pairing from Week 10 (rotate the assignment ring by two positions so no student reviews the same partner twice).

        Pre-class setup: Instructor circulates the reproducibility audit checklist 48 hours before class. Each student must have their repository in a state where it could plausibly be reviewed by a stranger.

        Reproducibility Audit Checklist (reviewer works through these in order):
          1. Clone test: Does `git clone <repo> && cd <repo> && pip install -r requirements.txt && make reproduce` complete without errors on a fresh environment? (If not: what is the first failure point?)
          2. Figure provenance: Is every figure that appears in the paper generated by a named, findable script? (Check each figure's caption for a filename or command.)
          3. Data provenance: Does provenance.json (or equivalent) cover all data sources with URLs, download dates, and file hashes?
          4. Secret hygiene: Are all API keys absent from committed files? Is a .env.example present with instructions for obtaining each key?
          5. Output stability: Do numerical outputs match the expected ranges or checksums documented in the README? (Run the reproduction command and compare.)

        In-class structure (45 min):
        - Minutes 0-30: Each reviewer works through the checklist against their assigned partner's repository. Write checklist findings as GitHub PR review comments (one comment per checklist item, minimum). Flag any item as PASS, PARTIAL, or FAIL with a one-sentence justification.
        - Minutes 30-40: Reviewer-author pairs meet for 10 minutes. Reviewer walks through their FAIL and PARTIAL findings. Author asks clarifying questions and notes which issues they plan to fix before Week 13.
        - Minutes 40-45: Round-robin share-out (1 min per student): each reviewer names the single checklist item their partner's repo failed or nearly failed, and the specific fix required.

        After class: reviewer submits the completed checklist as a GitHub PR review or as a structured markdown file (reproducibility_audit_<reviewer>_reviews_<author>.md) within 24 hours.
      facilitation_notes: |
        Distribute the audit checklist as a printout at the start of class — even students who read it digitally benefit from a physical copy to mark up. During minutes 0-30, circulate and ask each reviewer "Which checklist item have you found to be the hardest to verify so far?" — this surfaces common gaps across projects and lets you intervene early. If a student's `make reproduce` fails immediately, help them get unstuck (one intervention of up to 3 minutes) rather than letting them spend the whole period debugging a trivial environment issue. Remind reviewers that a PARTIAL is not a pass: if a reproduction command exists but is not documented in the README, that is PARTIAL, not PASS. The round-robin share-out at the end creates a public record of what reproducibility gaps are common across the class — photograph or transcribe the board and post it to the course repository.
      estimated_duration: "45 minutes"
      materials_needed: "Reproducibility audit checklist (printed or shared digitally 48 hours before class); GitHub access for all students; laptops required; sha256sum available on each machine"

homework:
  week: 12
  title: "Limitations Section, Review Responses, and Self-Audit"
  phase: "Phase 3: Project Execution & Polish"
  assessment_category: "Peer Review & Participation"
  background: |
    With the second round of peer code review complete, your project is entering its final polishing phase. This week's homework has three mutually reinforcing tasks. First, you will write the limitations section of your final paper — the section that requires the most intellectual honesty because it asks you to characterize where your AI methods fail. Second, you will formally close out the Week 10 peer review cycle by resolving all blocking comments and documenting your decisions. Third, you will apply the Week 12 reproducibility audit checklist to your own repository before Week 13's final check, so you arrive at the final submission deadline without last-minute surprises.
  instructions:
    - step: 1
      text: |
        Write the limitations section for your final paper in RevTeX (400-600 words, not counting any inline citations). The section must:
          (a) Identify at least two specific failure modes of the AI method(s) you used — not generic AI limitations, but limitations observable in your own results (e.g., "the retrieval step returns irrelevant abstracts when the query uses non-standard terminology, which we observed in 3 of 12 test queries on lattice QCD papers").
          (b) Quantify the failure mode where possible (frequency, magnitude, or severity).
          (c) Describe what additional data, compute, or methodological change would be required to overcome each limitation.
          (d) Cite at least one paper from the Week 11 or Week 12 reading group that corroborates or contextualizes a limitation you describe.
        Save as limitations_<lastname>.tex. This section will be incorporated directly into the final paper.
    - step: 2
      text: |
        Resolve all blocking comments from your Week 10 peer review. For each blocking comment:
          (a) Implement the fix and reference the fixing commit SHA in a REVIEW_RESPONSES.md file (e.g., "Resolved in commit abc1234: added sha256 checksum to README data download section").
          (b) If you are not implementing a fix, document your decision with a one-paragraph justification in REVIEW_RESPONSES.md explaining why the comment does not apply or why the alternative approach is preferable.
        Every blocking comment must have an entry in REVIEW_RESPONSES.md. Non-blocking suggestions may be addressed at your discretion, but note which ones you chose to address and which you deferred.
    - step: 3
      text: |
        Run the Week 12 reproducibility audit checklist (five items) against your own repository as a self-audit. For each checklist item, record your honest assessment (PASS, PARTIAL, or FAIL) and the specific evidence (e.g., the exact command you ran and its output). Submit this self-audit as self_audit_checklist_<lastname>.md. For any item you rated PARTIAL or FAIL, add a brief plan (1-3 sentences) describing what you will fix before the Week 14 final submission.
  deliverables:
    - "limitations_<lastname>.tex — limitations section in RevTeX (400-600 words)"
    - "REVIEW_RESPONSES.md — responses to all Week 10 peer review comments (blocking comments fully resolved)"
    - "self_audit_checklist_<lastname>.md — reproducibility self-audit with PASS/PARTIAL/FAIL per item and remediation plan for any non-PASS items"
  grading_criteria:
    - criterion: "Discussion engagement"
      weight: "30%"
      description: "Substantive contributions in both the reading group synthesis seminar (Meeting 1) and the review-pair debrief (Meeting 2); demonstrates having read and annotated the assigned papers before class. Assessed by in-class observation and post-class self-assessment form submitted within 24 hours."
    - criterion: "Reproducibility audit quality"
      weight: "35%"
      description: "The self-audit checklist is complete (all five items addressed), honest (PARTIAL and FAIL ratings are not inflated to PASS), and identifies at least one genuine gap with a specific, actionable remediation plan. Reviewers' audit of their partner's repo is also graded here: at least one FAIL or PARTIAL must be documented with a line-level comment and a concrete fix."
    - criterion: "Limitations section quality"
      weight: "35%"
      description: "Honestly describes at least two AI method failure modes with specific examples drawn from the student's own results (not generic AI criticism); at least one failure mode is quantified; at least one citation from the Week 11 or Week 12 reading group is incorporated; the section is 400-600 words in valid RevTeX."
  estimated_time: "4-6 hours (1-2 hr limitations section + 1-2 hr review responses + 1 hr self-audit)"
  due: "All three deliverables submitted before Week 13 Meeting 1; REVIEW_RESPONSES.md must be committed to the project repository (not submitted separately)"
  tools_and_resources:
    - "RevTeX (document class revtex4-2) for the limitations section"
    - "GitHub Pull Request interface for resolving and referencing review comments"
    - "GNU Make for running the reproduction command during self-audit"
    - "sha256sum for generating and verifying file checksums in the audit"
