week: 12
phase: "Phase 3: Project Execution & Polish"
title: "Seminar / Reading Group & Peer Review"

learning_objectives:
  - "Synthesize recent AI-in-physics papers into concrete evaluation and reproducibility lessons for final projects."
  - "Provide and receive peer review focused on reproducibility gaps, documentation completeness, and defensible scientific claims."
  - "Translate reading-group insights into stronger results, limitations, and review-response writing."

milestones:
  - "Combined reading-group discussion completed with project-specific takeaways recorded by each student."
  - "Reproducibility audit findings documented and incorporated into final project revisions."

meetings:
  - meeting: 1
    title: "Combined Reading Group"
    student_introduction:
      assigned_to: "TK and NRN (co-facilitating presenters), with TL & NACV leading the cross-cutting discussion portion"
      topic_prompt: |
        This week compresses the three reading-group meetings formerly spread across two weeks
        into one extended seminar. TK and NRN co-facilitate back-to-back 15-minute paper
        discussions on recent AI-in-physics papers directly relevant to their projects,
        following the Week 11 reading-group structure: the physical problem being solved, the
        AI method used and why it was chosen, the evaluation approach and its adequacy, one
        specific idea they will adapt in their own work, one weakness or open question, and
        three discussion questions for the class.

        TL and NACV then lead a 15-minute cross-cutting discussion segment focused on field-wide
        reproducibility and reliability issues in AI-in-physics research. They should use one of
        the advanced papers previously assigned for the cross-cutting reading group (for example,
        Hutson 2018 or Kapoor & Narayanan 2023), sketch the core claim on the whiteboard, connect
        it to a concrete failure mode from the earlier paper discussions, and propose one
        corrective practice the class could adopt immediately.
      format: "Extended 55-minute seminar with multiple 15-minute paper discussions"
      guiding_questions:
        - "What evaluation patterns recur across the papers discussed today, and which of those patterns are strong enough to borrow for your own project?"
        - "Which criticism would a skeptical referee most likely raise about the evidence in these papers?"
        - "What reproducibility or reliability practice from the cross-cutting discussion should become a non-negotiable part of your final repository and paper?"
    active_engagement:
      format: "Extended seminar"
      description: |
        Minutes 0-15: TK leads the first paper discussion using the structured Week 11 format.

        Minutes 15-30: NRN leads the second paper discussion, again focusing on physical
        problem, AI method, evaluation quality, one concrete takeaway, one weakness, and three
        discussion questions.

        Minutes 30-45: TL and NACV jointly lead the cross-cutting discussion segment. They
        synthesize themes from the first two papers with an advanced reproducibility/reliability
        paper and ask the class to identify one failure mode or evaluation blind spot that also
        appears in their own projects.

        Minutes 45-55: Whole-class synthesis. Instructor asks: "What evaluation pattern appeared
        in more than one paper today?" and "What is the single most important change you will
        make to your own results, limitations, or reproducibility documentation because of this
        discussion?" Each student records one sentence answer for use in their homework.
      facilitation_notes: |
        Ask TK and NRN to post their papers to the course repository 48 hours before class, and
        ask TL and NACV to share the cross-cutting paper or perspective they will use for the
        final segment on the same schedule. Keep a running whiteboard list with two columns:
        "evaluation patterns" and "open referee questions." If discussion stalls, project a
        specific figure or table from one of the papers and ask how a stranger would reproduce it
        from a fresh clone of the repository. Because three sessions are being compressed into one,
        timekeeping matters: cut transitions quickly and reserve the final 10 minutes for synthesis.
      estimated_duration: "55 minutes"
      materials_needed: "Whiteboard; papers shared digitally 48 hours in advance; printed or annotated copies of the selected papers; index cards or notebooks for final synthesis notes"

  - meeting: 2
    title: "In-Class Peer Code Review — Reproducibility Audit"
    student_introduction:
      assigned_to: "NACV (live demo)"
      topic_prompt: |
        Topic: what a complete, publication-ready README looks like for an AI-assisted physics project. Study the following resources before class:
          • "Art of README" (https://github.com/hackergrrl/art-of-readme) — read the full document.
          • At least two READMEs from published AI-in-physics codebases on GitHub (e.g., from papers with code, https://paperswithcode.com, filtered to physics).
          • The Software Sustainability Institute checklist for research software documentation (https://www.software.ac.uk/resources/guides).
        Your 8-minute chalk talk (no notes, whiteboard only) must cover exactly these five required elements of a publication-ready README:
          1. Installation: exact commands from a clean environment (conda or venv, Python version pinned).
          2. Data download: the exact command or URL to retrieve all input data, plus the expected file sizes or checksums.
          3. Reproduction command: the single command that regenerates all figures in the paper (e.g., `make reproduce`).
          4. Expected outputs: what the user should see — with numerical ranges or sha256 checksums for key output files.
          5. Known failure modes: at least one documented situation in which the pipeline fails or gives wrong results, with a workaround.
        End your talk by posing this question to the room: "Of the five elements, which one is most commonly missing in physics code releases — and why?"
      format: "8-minute chalk talk"
      guiding_questions:
        - "Of the five README elements, which is most commonly missing in physics code releases — and why?"
        - "How do you write a reproduction command that works on hardware you don't control?"
        - "What is the difference between documenting a known failure mode and hiding it?"
    active_engagement:
      format: "Peer code review"
      description: |
        Second in-class peer code review session, focused entirely on reproducibility audit. This round uses a different partner pairing from Week 11 (rotate the assignment ring by two positions so no student reviews the same partner twice).

        Pre-class setup: Instructor circulates the reproducibility audit checklist 48 hours before class. Each student must have their repository in a state where it could plausibly be reviewed by a stranger.

        Reproducibility Audit Checklist (reviewer works through these in order):
          1. Clone test: Does `git clone <repo> && cd <repo> && pip install -r requirements.txt && make reproduce` complete without errors on a fresh environment? (If not: what is the first failure point?)
          2. Figure provenance: Is every figure that appears in the paper generated by a named, findable script? (Check each figure's caption for a filename or command.)
          3. Data provenance: Does provenance.json (or equivalent) cover all data sources with URLs, download dates, and file hashes?
          4. Secret hygiene: Are all API keys absent from committed files? Is a .env.example present with instructions for obtaining each key?
          5. Output stability: Do numerical outputs match the expected ranges or checksums documented in the README? (Run the reproduction command and compare.)

        In-class structure (45 min):
        - Minutes 0-30: Each reviewer works through the checklist against their assigned partner's repository. Write checklist findings as GitHub PR review comments (one comment per checklist item, minimum). Flag any item as PASS, PARTIAL, or FAIL with a one-sentence justification.
        - Minutes 30-40: Reviewer-author pairs meet for 10 minutes. Reviewer walks through their FAIL and PARTIAL findings. Author asks clarifying questions and notes which issues they plan to fix before Week 13.
        - Minutes 40-45: Round-robin share-out (1 min per student): each reviewer names the single checklist item their partner's repo failed or nearly failed, and the specific fix required.

        After class: reviewer submits the completed checklist as a GitHub PR review or as a structured markdown file (reproducibility_audit_<reviewer_lastname>_reviews_<author_lastname>.md) within 24 hours.
      facilitation_notes: |
        Distribute the audit checklist as a printout at the start of class — even students who read it digitally benefit from a physical copy to mark up. During minutes 0-30, circulate and ask each reviewer "Which checklist item have you found to be the hardest to verify so far?" — this surfaces common gaps across projects and lets you intervene early. If a student's `make reproduce` fails immediately, help them get unstuck (one intervention of up to 3 minutes) rather than letting them spend the whole period debugging a trivial environment issue. Remind reviewers that a PARTIAL is not a pass: if a reproduction command exists but is not documented in the README, that is PARTIAL, not PASS. The round-robin share-out at the end creates a public record of what reproducibility gaps are common across the class — photograph or transcribe the board and post it to the course repository.
      estimated_duration: "45 minutes"
      materials_needed: "Reproducibility audit checklist (printed or shared digitally 48 hours before class); GitHub access for all students; laptops required; sha256sum available on each machine"

homework:
  week: 12
  title: "Draft Results, Limitations, Review Responses, and Reproducibility Self-Audit"
  phase: "Phase 3: Project Execution & Polish"
  assessment_category: "Peer Review & Participation"
  background: |
    This compressed week combines the drafting and reflection work previously spread across
    the reading-group sequence and the follow-up peer-review week. You will translate the
    reading-group discussions into scientific prose, document how you would answer skeptical
    reviewers, resolve real peer-review comments, and perform a reproducibility self-audit
    before the final showcase week. Taken together, these tasks move your project from
    "working pipeline" to "defensible research artifact."
  instructions:
    - step: 1
      text: "Write a draft results section (600-900 words) for your project paper in RevTeX format (results_draft_<lastname>.tex). The section must: (a) report your primary evaluation metric with a numeric value and uncertainty estimate (e.g., 'MAE = 0.08 ± 0.02 eV, compared to the DFT baseline of 0.31 ± 0.05 eV'); (b) include at least one figure (saved as results_fig1_<lastname>.pdf) showing the AI output vs. baseline or ground truth; (c) state explicitly what each AI-generated quantity represents physically; (d) note at least one result that was unexpected or inconsistent with prior work."
    - step: 2
      text: "Write a 300-word reading group summary (reading_group_summary_<lastname>.md) covering the papers discussed in this week's combined seminar. For at least two papers, state the main claim in one sentence, identify the strongest and weakest aspect of the evaluation, and write one question you would ask the authors. Commit the summary to the course repository before Week 12 Meeting 2."
    - step: 3
      text: "Write responses to two skeptical reviewer questions about your AI methodology in rebuttal-letter style (reviewer_response_<lastname>.md). Quote each hypothetical reviewer comment, then write a 100-150 word response citing your evaluation protocol, baseline comparison, and reproducibility controls. Use the most challenging questions raised during the combined reading-group discussion if possible."
    - step: 4
      text: |
        Write the limitations section for your final paper in RevTeX (400-600 words, not counting any inline citations). The section must:
          (a) Identify at least two specific failure modes of the AI method(s) you used — not generic AI limitations, but limitations observable in your own results.
          (b) Quantify the failure mode where possible (frequency, magnitude, or severity).
          (c) Describe what additional data, compute, or methodological change would be required to overcome each limitation.
          (d) Cite at least one paper from this week's reading group that corroborates or contextualizes a limitation you describe.
        Save as limitations_<lastname>.tex. This section will be incorporated directly into the final paper.
    - step: 5
      text: |
        Resolve all blocking comments from your Week 11 peer review. For each blocking comment:
          (a) Implement the fix and reference the fixing commit SHA in a REVIEW_RESPONSES.md file (e.g., "Resolved in commit abc1234: added sha256 checksum to README data download section").
          (b) If you are not implementing a fix, document your decision with a one-paragraph justification in REVIEW_RESPONSES.md explaining why the comment does not apply or why the alternative approach is preferable.
        Every blocking comment must have an entry in REVIEW_RESPONSES.md. Non-blocking suggestions may be addressed at your discretion, but note which ones you chose to address and which you deferred.
    - step: 6
      text: |
        Run the reproducibility audit checklist (five items) against your own repository as a self-audit. For each checklist item, record your honest assessment (PASS, PARTIAL, or FAIL) and the specific evidence (e.g., the exact command you ran and its output). Submit this self-audit as self_audit_checklist_<lastname>.md. For any item you rated PARTIAL or FAIL, add a brief plan (1-3 sentences) describing what you will fix before the final submission.
  deliverables:
    - "results_draft_<lastname>.tex — draft results section in RevTeX"
    - "results_fig1_<lastname>.pdf — figure showing AI output vs. baseline or ground truth"
    - "reading_group_summary_<lastname>.md — reading-group synthesis summary"
    - "reviewer_response_<lastname>.md — responses to two hypothetical skeptical reviewer questions"
    - "limitations_<lastname>.tex — limitations section in RevTeX (400-600 words)"
    - "REVIEW_RESPONSES.md — responses to all Week 11 peer review comments (blocking comments fully resolved)"
    - "self_audit_checklist_<lastname>.md — reproducibility self-audit with PASS/PARTIAL/FAIL per item and remediation plan for any non-PASS items"
  grading_criteria:
    - criterion: "Discussion engagement"
      weight: "20%"
      description: "Substantive contributions in both the combined reading-group seminar and the reproducibility-audit debrief; demonstrates having read and annotated the assigned papers before class."
    - criterion: "Results section quality"
      weight: "20%"
      description: "The draft results section reports the evaluation metric with uncertainty, includes a figure comparing AI to baseline, and explicitly interprets each quantity in physical terms."
    - criterion: "Reading group summary"
      weight: "10%"
      description: "The summary addresses the required points for the discussed papers and is committed to the course repository on time."
    - criterion: "Reviewer response quality"
      weight: "10%"
      description: "Each hypothetical reviewer response is evidence-based, specific, and directly addresses the concern raised."
    - criterion: "Reproducibility audit quality"
      weight: "20%"
      description: "The self-audit checklist is complete, honest, and identifies at least one genuine gap with a specific remediation plan; the in-class audit of a partner repository is also substantive."
    - criterion: "Limitations section quality"
      weight: "20%"
      description: "The limitations section identifies at least two concrete failure modes from the student's own work, quantifies at least one of them, and situates the discussion in the course reading group."
  estimated_time: "9-13 hours"
  due: "reading_group_summary_<lastname>.md committed before Week 12 Meeting 2; all remaining deliverables submitted before Week 13 Meeting 1; REVIEW_RESPONSES.md must be committed to the project repository"
  tools_and_resources:
    - "RevTeX 4.2 (or Overleaf for online editing)"
    - "matplotlib with publication-quality defaults (plt.rcParams update)"
    - "Semantic Scholar or Google Scholar for paper discovery"
    - "APS Physical Review Data author guidelines (https://journals.aps.org/prd/authors)"
    - "GitHub Pull Request interface for resolving and referencing review comments"
    - "GNU Make for running the reproduction command during self-audit"
    - "sha256sum for generating and verifying file checksums in the audit"
