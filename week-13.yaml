week: 13
phase: "Phase 3: Project Execution & Polish"
title: "Scientific Communication & Showcase"

meetings:
  - meeting: 1
    title: "Pre-Showcase Writing, Practice Presentations, and Adversarial Q&A"
    student_introduction:
      assigned_to: "IS and NRN"
      topic_prompt: |
        This compressed pre-showcase meeting combines the paper-writing guidance, practice
        showcase presentation, and adversarial Q&A rehearsal that were previously spread across
        multiple sessions.

        IS opens the meeting with the student introduction segment on writing the AI-assisted
        physics paper: present how AI writing assistants have been used in published physics
        papers, where they have gone wrong, one specific correction or retraction case, and a
        practical workflow for using LLMs to improve clarity without distorting scientific claims.

        NRN then presents a short showcase-practice demonstration: model an effective opening for
        a mixed physics audience by stating the motivation, the specific research question, and
        the key result with one figure. Use the demonstration to transition directly into the
        class practice-presentation and peer-feedback portion.
      format: "Combined paper presentation + showcase practice demo"
      guiding_questions:
        - "How do you improve clarity with AI assistance without overstating what the data actually support?"
        - "What makes a practice talk strong enough that a mixed physics audience can understand the research question within the first minute?"
        - "What adversarial question would most expose a weakness in your current argument, figure, or methods description?"
    active_engagement:
      format: "Structured workshop"
      description: |
        This meeting is intentionally compressed into one extended pre-showcase session.

        Minutes 0-15: Paper-writing guidance. The class discusses how to use AI writing tools
        responsibly when drafting abstracts, introductions, and results prose. Instructor uses
        IS's opening presentation to anchor a short discussion of acceptable vs. unacceptable AI
        writing assistance and asks students to identify one sentence in their own paper draft
        that requires especially careful claim-checking.

        Minutes 15-40: Practice presentations with structured peer feedback. Students deliver a
        short practice version of their showcase talk (motivation → question → key result → one
        conclusion). NRN's demonstration serves as the model. Peers complete written feedback on
        clarity, quantitative specificity, and whether the AI methodology is explained at a level
        a non-AI physicist could evaluate.

        Minutes 40-55: Adversarial Q&A rehearsal. Instructor and classmates play the role of a
        skeptical departmental audience, asking pointed questions about baselines, hallucination
        risk, uncertainty, and reproducibility. The goal is to surface vulnerable claims before
        the final showcase.
      facilitation_notes: |
        Tell students in advance that this session is deliberately compressed and paced tightly.
        The first 15 minutes should stay focused on paper-writing guidance rather than drifting
        into general discussion. Time the practice talks strictly and collect written feedback so
        every student leaves with concrete revision notes. During the adversarial Q&A segment,
        challenge the strongest and weakest talks alike: the point is not embarrassment, but
        pressure-testing claims before the public showcase.
      estimated_duration: "55 minutes"
      materials_needed: "Shared feedback form (Google Form or printed copies); visible countdown timer; projector; index cards or notes for rapid peer feedback"

  - meeting: 2
    title: "Departmental Showcase"
    student_introduction:
      assigned_to: "AAAM (chalk talk opener), followed by all students' showcase presentations"
      topic_prompt: |
        Reflect on the semester's course arc in a forward-looking synthesis, not a recap: what
        has changed in AI capabilities for physics research since the course began? Find one
        AI-in-physics development from the past month (preprint, tool release, or policy change)
        and present it as a "course update" — what would we cover differently if the course
        started today? Connect the new development explicitly to one topic from Phase 1 or Phase 2
        that it would change, extend, or supersede.
      format: "8-minute chalk talk"
      guiding_questions:
        - "What is the single most important thing you learned about AI's role in physics research that you did not know at the start of the main curriculum?"
        - "What capability or tool released in the last month would have changed how you designed your project?"
        - "What question about AI in physics research do you now have that you did not know to ask in Week 2?"
    active_engagement:
      format: "Structured debate"
      description: |
        Showcase presentations (105 min for 7 students at 10+5 min each; may be extended if the showcase is held in a larger venue with more Q&A time).

        After all presentations (final 10 min): Course retrospective. Instructor asks three questions in sequence; students respond popcorn-style (anyone can speak, no repeating what was said):
        (1) "What is the one AI tool or technique from this course you will still be using in your research five years from now?"
        (2) "What is the one thing about AI in physics research that turned out to be much harder than you expected?"
        (3) "What would you tell a first-year graduate student who is considering this course next year?"

        Instructor closes with a brief reflection on how AI capabilities have evolved over the semester, and what that means for physics research going forward.
      facilitation_notes: |
        Coordinate with the department to secure a larger room and invite faculty at least two weeks in advance. Assign a student timekeeper with a visible 2-minute warning signal. After the retrospective, take a group photo. Collect all showcase slide decks and post them to the course repository with student permission. Send a thank-you email to faculty attendees with links to students' GitHub repositories.
      estimated_duration: "105 minutes presentations + 10 minutes retrospective = 115 minutes (or more if extended)"
      materials_needed: "Departmental presentation room; projector; student slide decks submitted 24 hours in advance; visible timer; faculty invited 2 weeks in advance"

homework:
  week: 13
  title: "Final Project Codebase, Paper, and Showcase Presentation"
  phase: "Phase 3: Project Execution & Polish"
  assessment_category: "Final Project Codebase & Paper (25%) and Departmental Showcase Presentation (25%)"
  background: |
    This final week has no new exploratory assignment — the semester's work culminates in two
    public-facing deliverable clusters that together constitute 50% of your course grade. The
    final codebase and paper represent the scientific contribution; the showcase presentation is
    your public defense of that contribution. Both are due before Meeting 1 of Week 13.
  instructions:
    - step: 1
      text: "Submit your final paper as a compiled PDF (paper_final_<lastname>.pdf) via the course submission portal or by emailing the instructor. The paper must be 4-6 pages in RevTeX, include all six sections (Abstract, Introduction, Methods, Results, Discussion, Conclusion), report at least one evaluation metric with uncertainty, and include an AI Tools & Ethics statement. The paper must compile from source using 'pdflatex paper_final_<lastname>.tex' with no errors."
    - step: 2
      text: "Starting from your v0.9-draft tag, refine the repository to incorporate final fixes and then create v1.0-final using 'git tag v1.0-final && git push origin v1.0-final'. The tagged commit must include: all analysis notebooks, data_pipeline_<lastname>.py, provenance.json, REPRODUCIBILITY.md, BUG_LOG.md, claim_trace_<lastname>.md, a complete README with a one-command reproduction instruction, requirements.txt or environment.yml, and the compiled paper PDF."
    - step: 3
      text: "Submit your showcase slide deck (slides_final_<lastname>.pdf, ≤12 slides) at least 24 hours before Meeting 2. Slides must include: a title slide with your research question, at least one figure showing your key result vs. the baseline with uncertainty bars, and a final slide stating your main conclusion and one open question."
    - step: 4
      text: "Deliver your 10-minute showcase presentation in Meeting 2. Speak to the slides you submitted; do not read from them. Be prepared to answer adversarial questions about your AI methodology. After the Q&A, submit a one-page self-assessment (self_assessment_<lastname>.md) within 48 hours of the showcase: state your strongest result, your biggest methodological limitation, and one specific thing you would do differently."
  deliverables:
    - "paper_final_<lastname>.pdf — final 4-6 page RevTeX paper"
    - "GitHub repository tagged v1.0-final with all required files"
    - "slides_final_<lastname>.pdf — showcase slide deck (≤12 slides, submitted 24 hr before showcase)"
    - "self_assessment_<lastname>.md — one-page self-assessment submitted within 48 hours of the showcase"
  grading_criteria:
    - criterion: "Reproducibility (Codebase & Paper — 25%)"
      weight: "30%"
      description: "Running 'git clone && pip install -r requirements.txt && make reproduce' from a fresh environment produces the main result figure and matches the value reported in the paper within stated uncertainty."
    - criterion: "Physical interpretation (Codebase & Paper — 25%)"
      weight: "30%"
      description: "Every AI-generated quantity in the paper is explicitly interpreted in physical terms with units and uncertainty; at least one result is compared quantitatively to a non-AI baseline or literature value."
    - criterion: "Clarity of narrative (Showcase — 25%)"
      weight: "20%"
      description: "A physics faculty member unfamiliar with the student's subfield can follow the talk from motivation to conclusion without prior briefing; the research question is stated in the first 2 minutes."
    - criterion: "Defensibility of AI claims (Showcase — 25%)"
      weight: "20%"
      description: "The student answers at least two adversarial questions about their AI methodology with specific evidence (citing evaluation metric, baseline comparison, or reproducibility controls) rather than general assurances."
  estimated_time: "No new work this week — all deliverables assembled from previous weeks"
  due: "Final paper and repository tag due before Meeting 1 of Week 13; slides due 24 hours before Meeting 2"
  tools_and_resources:
    - "git tag and git push origin for creating the final repository release"
    - "pdflatex or Overleaf for compiling the final paper"
    - "GNU Make for the one-command reproduction target"
    - "GitHub Releases page to verify the v1.0-final tag is publicly visible"
